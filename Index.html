<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सफ़र राइडर - लखनऊ</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('rider');
            const [pickup, setPickup] = React.useState('हज़रतगंज (Hazratganj)');
            const [dropoff, setDropoff] = React.useState('गोमती नगर (Gomti Nagar Palassio)');
            const [isDriverOnline, setIsDriverOnline] = React.useState(false);
            const [driverEarnings, setDriverEarnings] = React.useState(1450);
            const [rideBooked, setRideBooked] = React.useState(false);

            const lucknowLocations = [
                'हज़रतगंज (Hazratganj)',
                'गोमती नगर (Gomti Nagar Palassio)',
                'चारबाग रेलवे स्टेशन (Charbagh Railway Station)',
                'चौक (Chowk Famous Market)',
                'अमौसी एयरपोर्ट (Lucknow Airport - CCSI)',
                'इंदिरा नगर (Indira Nagar)',
                'आलमबाग बस टर्मिनल (Alambagh Bus Stand)'
            ];

            return (
                <div className="min-h-screen bg-slate-900 text-white flex flex-col max-w-md mx-auto shadow-2xl">
                    {/* Header */}
                    <header className="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center">
                        <h1 className="text-lg font-bold text-amber-400 flex items-center gap-2">
                            🚖 सफ़र राइडर - लखनऊ
                        </h1>
                        <div className="flex bg-slate-700 rounded-lg p-1">
                            <button 
                                onClick={() => setActiveTab('rider')}
                                className={`px-3 py-1 text-xs rounded-md transition ${activeTab === 'rider' ? 'bg-amber-500 text-black font-semibold' : 'text-slate-300'}`}>
                                राइडर
                            </button>
                            <button 
                                onClick={() => setActiveTab('driver')}
                                className={`px-3 py-1 text-xs rounded-md transition ${activeTab === 'driver' ? 'bg-amber-500 text-black font-semibold' : 'text-slate-300'}`}>
                                चालक
                            </button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="p-4 flex-1 space-y-4">
                        {activeTab === 'rider' ? (
                            <div className="space-y-4">
                                <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
                                    <h2 className="text-sm font-semibold text-slate-200 mb-3">लखनऊ में अपनी राइड बुक करें</h2>
                                    <div className="space-y-3">
                                        <div>
                                            <label className="text-xs text-slate-400">पिकअप लोकेशन (Pickup)</label>
                                            <select 
                                                value={pickup} 
                                                onChange={(e) => setPickup(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-amber-300 focus:outline-none mt-1">
                                                {lucknowLocations.map(loc => <option key={loc} value={loc}>{loc}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-400">ड्रॉप लोकेशन (Drop-off)</label>
                                            <select 
                                                value={dropoff} 
                                                onChange={(e) => setDropoff(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-amber-300 focus:outline-none mt-1">
                                                {lucknowLocations.map(loc => <option key={loc} value={loc}>{loc}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                {/* Rates */}
                                <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2">
                                    <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">वैकल्पिक वाहन और किराए (Rates in ₹)</h3>
                                    <div className="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700">
                                        <div>
                                            <p className="font-semibold text-sm text-yellow-400">🛺 ई-रिक्शा / ऑटो</p>
                                            <p className="text-xs text-slate-400">5 मिनट दूर</p>
                                        </div>
                                        <p className="text-amber-400 font-bold text-sm">₹50 - ₹90</p>
                                    </div>
                                    <div className="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700">
                                        <div>
                                            <p className="font-semibold text-sm text-blue-400">🚗 सफ़र कैब (Mini/Sedan)</p>
                                            <p className="text-xs text-slate-400">AC आरामदायक सफर</p>
                                        </div>
                                        <p className="text-amber-400 font-bold text-sm">₹140 - ₹220</p>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setRideBooked(!rideBooked)}
                                    className={`w-full py-3 rounded-xl font-bold shadow-lg transition text-sm ${rideBooked ? 'bg-green-500 text-black' : 'bg-amber-500 hover:bg-amber-600 text-black'}`}>
                                    {rideBooked ? '✓ राइड खोज रहे हैं...' : 'राइड बुक करें (Book Now)'}
                                </button>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center shadow-lg">
                                    <div>
                                        <p className="text-xs text-slate-400">आज की कुल कमाई</p>
                                        <p className="text-2xl font-bold text-green-400">₹{driverEarnings}</p>
                                    </div>
                                    <button 
                                        onClick={() => setIsDriverOnline(!isDriverOnline)}
                                        className={`px-4 py-2 rounded-lg font-bold text-xs shadow-md transition ${isDriverOnline ? 'bg-green-500 text-black' : 'bg-red-500 text-white'}`}>
                                        {isDriverOnline ? '🟢 ऑनलाइन (ड्यूटी पर)' : '🔴 ऑफलाइन (आराम)'}
                                    </button>
                                </div>
                                <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center space-y-2">
                                    <p className="text-sm text-slate-300">चालक साथी डैशबोर्ड</p>
                                    <p className="text-xs text-slate-400">लखनऊ क्षेत्र में यूपीआई (UPI) के माध्यम से तुरंत भुगतान प्राप्त करें।</p>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
